[package]
name = "terminal-velocity"
version = "0.3.0"
authors = ["Taras Yanchynskyy"]
edition = "2021"
description = "Is your build's speed real throughput, or just thrashing? A git-status for build-flow health."
repository = "https://github.com/onebit0fme/terminal-velocity"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["git", "velocity", "metrics", "cli", "devex"]
categories = ["command-line-utilities", "development-tools"]

# The binary is `tv`; the package is `terminal-velocity` (rename the package at
# publish time if crates.io is taken — the binary name is independent).
[[bin]]
name = "tv"
path = "src/main.rs"

# Zero runtime dependencies, by design — std-only, so it builds offline with
# nothing to fetch (see CLAUDE.md). Arg parsing and ANSI color are hand-rolled
# and stay that way. The only dependency we'd ever consider is serde, and only if
# the HEAD-keyed cache outgrows its hand-written text format.
[dependencies]

[profile.release]
opt-level = 3
lto = true
strip = true

# Lets `cargo binstall terminal-velocity` fetch the prebuilt `tv` from the
# Releases page instead of compiling. Asset names match .github/workflows/release.yml
# (`tv-{target}.tar.gz`, zip on Windows); the tag is `v{version}`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tv-{ target }{ archive-suffix }"
bin-dir = "tv{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
