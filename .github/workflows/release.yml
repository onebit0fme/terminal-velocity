name: release

# Tag a version to cut a release:  git tag v0.1.0 && git push origin v0.1.0
# Each target builds natively on its own runner (no cross-compilation), then
# uploads its archive to a draft GitHub Release. The release is published only
# after every target succeeds, so users never see a half-populated release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Idempotent: reuse an existing draft if a prior run already created one
      # (e.g. a re-tagged release after a fix), so re-runs don't fail on "exists".
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: create-release
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,   os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl,  os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin,        os: macos-latest }
          # Intel macOS is cross-compiled on the Apple Silicon runner (no more
          # Intel runners — macos-13 is retired, macos-15-intel ends Aug 2027).
          # Can't execute an x86_64 binary on arm64, so this leg is build-only.
          - { target: x86_64-apple-darwin,         os: macos-latest, build_only: true }
          - { target: x86_64-pc-windows-msvc,      os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # musl needs its libc/linker; harmless on the pure-Rust build but avoids
      # any self-contained-linking surprise across runner toolchain versions.
      - name: Install musl tools
        if: contains(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        if: ${{ ! matrix.build_only }}
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          tar -C "target/${{ matrix.target }}/release" -czf "tv-${{ matrix.target }}.tar.gz" tv
          echo "ASSET=tv-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/tv.exe" -DestinationPath "tv-${{ matrix.target }}.zip"
          "ASSET=tv-${{ matrix.target }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish (undraft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # Bump the formula in onebit0fme/homebrew-tap to this release. Needs a PAT
  # with contents:write on the tap repo, stored as the HOMEBREW_TAP_TOKEN
  # secret (the default GITHUB_TOKEN can't write to another repo). Skipped —
  # not failed — when the secret is absent, so it's safe to merge before adding it.
  update-tap:
    needs: publish-release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Bump Homebrew formula
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: onebit0fme/homebrew-tap
          SRC: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: sh .github/update-tap.sh
